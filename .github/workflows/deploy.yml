name: Deploy

# C1 (tasks.md): кнопка в Actions -> build образа текущего main ->
# ghcr.io/yarexlab/presenton, деплой на сервер по SSH (git pull + compose
# pull + up -d), post-deploy smoke, чистка старых образов.
# Автозапуска нет — только вручную.
#
# Требуемые secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_HOST - хост сервера (yarexlab.ru)
#   DEPLOY_SSH_USER - пользователь SSH на сервере
#   DEPLOY_SSH_KEY  - приватный ключ (ed25519), authorized_keys на сервере
#   DEPLOY_PATH     - каталог репо на сервере с docker-compose.server.yml
#
# Разовая настройка сервера: docker login ghcr.io (PAT с read:packages),
# т.к. пакет приватный. Либо сделать пакет public — тогда логин не нужен.
#
# Откат: Actions -> Deploy -> Run workflow, deploy_tag = main-<sha предыдущего
# удачного деплоя> (build пропускается).

on:
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Existing image tag to deploy (e.g. main-abc1234). Empty = build current main."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yarexlab/presenton

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_tag == ''
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to yarexlab.ru
    runs-on: ubuntu-latest
    needs: build
    # production: можно включить Required reviewers в Settings -> Environments,
    # тогда деплой будет ждать ручного одобрения
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.inputs.deploy_tag || needs.build.outputs.tag }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && \
             git pull --ff-only && \
             YAREX_IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.server.yml pull presenton && \
             YAREX_IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.server.yml up -d --no-build"

      - name: Smoke check
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "curl -fsS --max-time 10 http://127.0.0.1:50521/api/v1/auth/status"; then
              echo "Smoke check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke check failed after 2 minutes" >&2
          exit 1

      - name: Prune old images on server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # старые тегированные версии main-<sha>, кроме текущей + висячие слои;
          # неудача чистки не роняет деплой
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "docker images --format '{{.Repository}}:{{.Tag}}' \
               | grep '^ghcr.io/yarexlab/presenton:main-' \
               | grep -v ':${IMAGE_TAG}' \
               | xargs -r docker rmi || true; \
             docker image prune -f"
